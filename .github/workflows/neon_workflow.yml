name: Neon Branch Cleanup

# This workflow only runs cleanup tasks for legacy branches.
# We no longer create per-PR Neon branches to stay within the 10 branch limit.
# All preview deployments share the `development` Neon branch.

on:
  # Run on schedule to clean up any orphaned branches
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sunday at midnight
  # Allow manual trigger
  workflow_dispatch:

jobs:
  cleanup:
    name: Cleanup Legacy Neon Branches
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup old preview and pr-* branches
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          echo "🧹 Checking for legacy Neon branches to clean up..."

          # Get all branches
          BRANCHES=$(curl -s \
            "https://console.neon.tech/api/v2/projects/${PROJECT_ID}/branches" \
            -H "Authorization: Bearer ${NEON_API_KEY}" \
            -H "Content-Type: application/json")

          # Protected branches that should never be deleted
          PROTECTED="production development vercel-dev main"

          # Delete branches starting with "preview/" or "pr-" (old conventions)
          echo "$BRANCHES" | jq -r '.branches[] | select(.name | test("^(preview/|pr-)")) | "\(.id) \(.name)"' | while read BRANCH_ID BRANCH_NAME; do
            if [ -n "$BRANCH_ID" ]; then
              echo "🗑️  Deleting legacy branch: $BRANCH_NAME ($BRANCH_ID)"
              curl -s -X DELETE \
                "https://console.neon.tech/api/v2/projects/${PROJECT_ID}/branches/${BRANCH_ID}" \
                -H "Authorization: Bearer ${NEON_API_KEY}" \
                -H "Content-Type: application/json" || true
            fi
          done

          echo "✅ Cleanup complete"

          # Show remaining branches
          echo ""
          echo "📊 Current Neon branches:"
          echo "$BRANCHES" | jq -r '.branches[] | "  - \(.name)"'
